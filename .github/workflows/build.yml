name: Build Skyward for Selene

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust & aarch64 Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Cargo-NDK
        run: cargo install cargo-ndk

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v3
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Build Skyward Binary
        run: |
          cargo ndk -t arm64-v8a --platform 30 build --release -p skyward

      - name: Build Skyward Packager
        run: |
          cargo build --release -p skyward-pack

      - name: Download Stock Recovery (Selene)
        run: |
          # Stok imajı kendi hostinginden veya ham ROM linkinden çekiyoruz
          curl -L -o stock_recovery.img "https://ornek-link.com/selene_stock_recovery.img"

      - name: Package Skyward Image
        run: |
          ./target/release/skyward-pack boot \
            --stock stock_recovery.img \
            --binary target/aarch64-linux-android/release/skyward \
            --config devices/selene.toml \
            --out skyward-selene.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skyward-selene-recovery
          path: skyward-selene.img
